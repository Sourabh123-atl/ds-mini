[project]
name = "ds-mini"
version = "1.0.0"
description = "FLUX - COVID-19 & Influenza Infectious Disease Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "vaderSentiment>=3.3.2",
    "plotly>=5.15.0",
]

[tool.vercel]
entrypoint = "api:app"
